# API 359 predates client_chat_received. Transform the display copy at wrap time:
# covers local/system/signed chat and rewraps, preserving stored messages and signatures.
[[module]]
id = "chat_transform"
file = "crates/horizon-client-render/src/chat.rs"
name = "liasmediaplayer_chat_transform"
source = "chat_transform.rs"
visibility = "pub"

[[injection]]
id = "chat_display"
target = "horizon_client_render::chat::Chat::displayed"
kind = "RETURN"
helper = "chat_received.rs"
bindings = [
  { name = "message", ty = "Text", value = "$value" },
]

# The commands catalog hook only supplies root names. Add argument suggestions
# to the completed client tree; pinned to the compatibility revision above.
[[injection]]
id = "command_tree"
target = "horizon_client::game::chat::with_native_commands"
kind = "RETURN"
helper = "command_tree.rs"
bindings = [
  { name = "tree", ty = "horizon_client::command::Dispatcher", value = "$value" },
  { name = "base", ty = "&horizon_client::command::Dispatcher", value = "base" },
  { name = "names", ty = "&[&str]", value = "names" },
]
