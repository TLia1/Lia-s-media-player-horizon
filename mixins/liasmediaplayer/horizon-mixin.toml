# Lia's Media Player — Horizon Native Mod Manifest (Milestone 7)
# Uses catalog hook points (`native-hooks.json`) and a dedicated workspace crate (`[[crate]]`).

[mod]
id = "liasmediaplayer"
version = "4.0.0"
priority = 100

[compatibility]
horizon_revision = "6475f62f3c834b7489e1816bf47f47ea5eb2b879"

# The mod's own crate, staged as `native-crates/liasmediaplayer/lias_media_player/`
# and added as a dependency of `horizon-client`.
[[crate]]
id = "lias_media_player"
path = "lias_media_player"

# Support module injected into `crates/horizon-client/src/game.rs` as
# `pub(crate) mod liasmediaplayer_bridge`.
[[module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "liasmediaplayer_bridge"
source = "bridge.rs"

# --- Catalog Hook Points (`native-hooks.json`, hook_version = 1) ---

[[injection]]
id = "mods"
hook = "mods"
hook_version = 1
kind = "HEAD"
helper = "mods.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "settings"
hook = "settings"
hook_version = 1
kind = "HEAD"
helper = "settings.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "mod_id", ty = "&str", value = "mod_id" },
  { name = "buttons", ty = "&mut Vec<String>", value = "&mut *buttons" },
]

