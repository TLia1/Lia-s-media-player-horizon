[package]
name = "lias_media_player"
version = "4.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "Lia's Media Player for Horizon: the mod's own crate (no Horizon imports)."

# Horizon's Cargo.lock is the allow list (E_CRATE_DEPENDENCY): every crate below must
# already be locked there in a matching version. `tools/check_lock.py` verifies it.
# No [workspace], [profile], [target.*], path or git dependencies: horizon-mixins refuses them.
[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
cpal = "0.16.0"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs", "runtime_detection"] }
hex = "0.4.3"
image-webp = { version = "0.2.4", default-features = false }
log = "0.4.34"
lz4_flex = { version = "0.14.0", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
open = "5.4.5"
os_pipe = "1.2.3"
parking_lot = "0.12.5"
png = "0.18.1"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rustc-hash = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.21"
toml = "1.1.6"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
url = "2.5.8"
zip = { version = "9.1.3", default-features = false, features = ["deflate"] }
zune-jpeg = { version = "0.4.21", default-features = false, features = ["std"] }
